name: PackageMaze install, test, publish and read back

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packagemaze-verification-${{ github.ref }}
  cancel-in-progress: false

env:
  PACKAGE: pm-onboarding-test-sampleproject
  VERSION: 4.0.${{ github.run_id }}.dev${{ github.run_attempt }}

jobs:
  install:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: '0.12.1'
      - id: access
        uses: packagemaze/setup-maze@88f78eca0212b355b26babf206c6151abb62f22b
        with:
          feed: pm-onboarding-test-20261024/pypi
          purpose: install
      - name: Install wheels through PackageMaze without building project code
        run: |
          uv sync --all-extras --no-install-project --no-build
          uv export --locked --all-extras --no-emit-project --no-hashes --output-file dependencies.txt
          uv run --no-project --directory "$RUNNER_TEMP" --python "$pythonLocation/bin/python" python -m pip download --only-binary=:all: --dest "$GITHUB_WORKSPACE/wheelhouse" -r "$GITHUB_WORKSPACE/dependencies.txt" build setuptools wheel
        env:
          UV_INDEX_PACKAGEMAZE_USERNAME: __token__
          UV_INDEX_PACKAGEMAZE_PASSWORD: ${{ steps.access.outputs.token }}
          PIP_INDEX_URL: https://__token__:${{ steps.access.outputs.token }}@pkg.packagemaze.com/pm-onboarding-test-20261024/pypi/simple/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dependencies
          path: |
            wheelhouse/
            uv.lock
            dependencies.txt
          if-no-files-found: error
          retention-days: 7

  build:
    needs: install
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: '0.12.1'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: dependencies
      - name: Prepare the build environment from retained wheels without credentials
        run: |
          uv venv --python 3.13
          uv pip install --no-index --find-links wheelhouse build setuptools wheel peppercorn check-manifest coverage
          uv run --no-sync python -c 'import os,pathlib; p=pathlib.Path("pyproject.toml"); p.write_text(p.read_text().replace("version = \"4.0.0\"", "version = \"" + os.environ["VERSION"] + "\"", 1))'
      - name: Run upstream tests without OIDC or package credentials
        run: uv run --no-sync python -m unittest discover -s tests
        env:
          PYTHONPATH: src
      - name: Build the wheel and source distribution offline
        run: |
          uv run --no-sync python -m build --no-isolation
          sha256sum dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: '0.12.1'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release
          path: dist
      - id: access
        uses: packagemaze/setup-maze@88f78eca0212b355b26babf206c6151abb62f22b
        with:
          feed: pm-onboarding-test-20261024/pypi
          purpose: publish
          package: pm-onboarding-test-sampleproject
      - name: Publish both built distributions to the test Feed
        run: uv publish --index packagemaze --no-attestations dist/*
        env:
          UV_PUBLISH_TOKEN: ${{ steps.access.outputs.token }}

  verify-install:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: '0.12.1'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release
          path: dist
      - id: access
        uses: packagemaze/setup-maze@88f78eca0212b355b26babf206c6151abb62f22b
        with:
          feed: pm-onboarding-test-20261024/pypi
          purpose: install
      - name: Install the exact version and compare wheel bytes
        run: |
          uv pip install --target readback --only-binary :all: "$PACKAGE==$VERSION"
          uv run --no-project python -I -c 'import os; from importlib.metadata import distributions; found={d.metadata["Name"]: d.version for d in distributions(path=["readback"])}; print(found); assert found[os.environ["PACKAGE"]] == os.environ["VERSION"]'
          uv run --no-project python -m pip download --no-deps --only-binary=:all: --dest returned "$PACKAGE==$VERSION"
          cmp dist/*.whl returned/*.whl
          sha256sum returned/*.whl
        env:
          UV_INDEX_PACKAGEMAZE_USERNAME: __token__
          UV_INDEX_PACKAGEMAZE_PASSWORD: ${{ steps.access.outputs.token }}
          PIP_INDEX_URL: https://__token__:${{ steps.access.outputs.token }}@pkg.packagemaze.com/pm-onboarding-test-20261024/pypi/simple/
